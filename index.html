<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob--mint"></span>
    <span class="blob blob--violet"></span>
    <span class="blob blob--gold"></span>
    <span class="blob blob--rose"></span>
  </div>

  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="grain" aria-hidden="true"></div>

  <main class="stage">
    <p class="eyebrow">Noël&nbsp;·&nbsp;2026</p>

    <div class="title">
      <h1>Merry<br /><em>Christmas</em></h1>
      <p class="sub">愿灯火长明，岁岁平安</p>
    </div>
  </main>

  <button id="sound" class="sound" type="button" aria-pressed="false" aria-label="开启八音盒音乐">
    <svg class="icon icon--off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" />
      <path d="M16 9.2 21 14.8M21 9.2 16 14.8" />
    </svg>
    <svg class="icon icon--on" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" />

    </svg>
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <p class="edge" aria-hidden="true">Winter&nbsp;·&nbsp;MMXXVI</p>

  <p class="hint" id="hint">移动鼠标 · 轻点放出星火</p>

  <script src="main.js"></script>
